[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mae-ast"
version = "0.1.0"
description = "Reimplementazione modulare di MAE-AST in PyTorch"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "torch",
    "torchaudio",
    "omegaconf",
    "numpy",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
analysis = [
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]