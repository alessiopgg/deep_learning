experiment:
  name: esc50_finetune_final_12l
  seed: 42
data:
  train_manifest: datafiles/esc50_train_fold1.json
  val_manifest: datafiles/esc50_eval_fold1.json
  test_manifest: null
  dataset_root: null
  stats_file: datafiles/audioset500k_train_stats_padded.json
  num_workers: 8
  pin_memory: true
  strict_loading: true
audio:
  sample_rate: 16000
  n_mels: 128
  frame_length_ms: 25
  frame_shift_ms: 10
  f_min: 20.0
  f_max: 8000.0
  pretrain_target_frames: 1024
  finetune_target_frames: 512
  resample: true
  normalize_to_half_std: true
  eps: 1.0e-08
  finetune_freq_mask: 0
  finetune_time_mask: 0
  finetune_noise: false
  finetune_noise_max_scale: 0.1
  finetune_time_roll_max: 0
patching:
  patch_h: 16
  patch_w: 16
model:
  type: mae
  dropout_input: 0.0
  encoder:
    layers: 12
    embed_dim: 768
    num_heads: 12
    mlp_ratio: 4.0
    dropout: 0.0
    attention_dropout: 0.0
    activation_dropout: 0.0
    layerdrop: 0.0
    norm_first: false
  decoder:
    layers: 2
    embed_dim: 768
    num_heads: 12
    mlp_ratio: 4.0
    dropout: 0.0
    attention_dropout: ${model.decoder.dropout}
    activation_dropout: ${model.decoder.dropout}
    layerdrop: 0.0
    norm_first: true
  num_classes: 50
masking:
  strategy: chunk
  ratio: 0.75
  chunk_sizes:
  - 3
  - 4
  - 5
  span_length: 10
  shared_across_batch: true
loss:
  reconstruction_weight: 10.0
  classification_weight: 1.0
  label_smoothing: 0.0
training:
  batch_size: 32
  validation_batch_size: 32
  epochs: 50
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  scheduler: polynomial
  warmup_steps: 0
  lr_decay_start_epoch: 6
  lr_decay_step_epochs: 1
  lr_decay_gamma: 0.85
  max_steps: null
  grad_clip_norm: 1.0
  val_mask_seed: 12345
  amp: true
  log_interval: 100
logging:
  backend: local
  wandb_project: mae-ast
  wandb_entity: null
  wandb_mode: offline
  wandb_group: null
  wandb_tags: []
  wandb_dir: outputs/wandb
checkpoint:
  output_dir: outputs/esc50
  save_best: true
  save_last: true
  save_every_steps: 1000
