# Fine-tuning ESC-50 coerente con la pipeline SSAST richiamata da MAE-AST.
# Il patching resta NON overlapping (16x16 con stride implicito 16),
# come previsto dalla nostra implementazione MAE-AST.

experiment:
  name: esc50_finetune_6l

audio:
  finetune_freq_mask: 24
  finetune_time_mask: 96
  finetune_noise: true
  finetune_noise_max_scale: 0.1
  finetune_time_roll_max: 10

training:
  batch_size: 48
  validation_batch_size: 96
  epochs: 50

  # SSAST downstream ESC-50 usa Adam con questi iperparametri.
  optimizer: adam
  learning_rate: 0.0001
  weight_decay: 5.0e-7
  betas: [0.95, 0.999]

  # Nessun warmup; decadimento del LR a epoche, a partire dalla 6.
  scheduler: multistep_epoch
  warmup_steps: 0
  lr_decay_start_epoch: 6
  lr_decay_step_epochs: 1
  lr_decay_gamma: 0.85
